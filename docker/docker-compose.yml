version: "2"
services:    
    comfyui_dev334:
        container_name: comfyui_dev334
        image: registry.cn-heyuan.aliyuncs.com/lingtu-ai/ai-py310-torch20-grpc-gpu:comfyui-1.3
        volumes:
         - /mnt:/mnt
         - /mnt/sfs_turbo/keen/models:/project/models
         - /mnt/sfs_turbo/keen/app/comfyui_0334:/project
         - /mnt/sfs_turbo/keen/app/custom_nodes_0334:/project/custom_nodes
        working_dir: /project
        restart: on-failure
        command: bash
        tty: true
        cap_add:
          - SYS_PTRACE    # 对docker开发CAP的gdb调试功能
        environment:
            NVIDIA_VISIBLE_DEVICES: 0
            RUNTIME_ENV: "dev"  # 运行时环境：dev-开发环境、fat-测试环境、prod-线上环境
        runtime: nvidia
        network_mode: host

